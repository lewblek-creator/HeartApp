workflows:
  android-build:
    name: Android Build

    environment:
      vars:
        CI: true
      java:
        version: 17   # <-- обязательно Java 17
      node:
        version: 20   # Node.js LTS, можно поменять если нужно
      flutter: false
      ruby: false

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor Android
        script: |
          npm install @capacitor/android

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Ensure gradlew is executable
        script: |
          cd android
          chmod +x gradlew
          cd ..

      - name: Build APK
        script: |
          cd android
          ./gradlew clean assembleDebug -Dorg.gradle.java.home=$JAVA_HOME
          cd ..

    artifacts:
      - android/app/build/outputs/**/*.apk
