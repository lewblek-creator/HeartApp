workflows:
  android-build:
    name: Android Build

    environment:
      vars:
        CI: true

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install Capacitor Android
        script: |
          npm install @capacitor/android

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/**/*.apk
